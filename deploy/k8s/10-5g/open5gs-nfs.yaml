# Open5GS network functions, one Deployment each, plus a headless Service per
# function. Headless (clusterIP: None) means the DNS name returns the pod IP
# itself, so traffic between functions carries real pod IPs (PENM sees which
# pod is the AMF, not a virtual service IP) and SCTP needs no load balancer.
# publishNotReadyAddresses lets a name resolve as soon as its pod has an IP.
# Generated: one block per function; keep them in step when editing.
---
apiVersion: v1
kind: Service
metadata:
  name: open5gs-nrf
  namespace: team-5g
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: open5gs-nrf
  ports:
    - name: sbi
      port: 7777
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-nrf
  namespace: team-5g
  labels:
    app: open5gs-nrf
    app.kubernetes.io/part-of: open5gs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open5gs-nrf
  template:
    metadata:
      labels:
        app: open5gs-nrf
        app.kubernetes.io/part-of: open5gs
    spec:
      nodeSelector:
        xtrust6g-node: penm
      containers:
        - name: nrf
          image: open5gs:2.7.6
          imagePullPolicy: IfNotPresent
          command: ["render.sh", "/config/nrf.yaml", "/etc/open5gs/nrf.yaml", "--",
                    "open5gs-nrfd", "-c", "/etc/open5gs/nrf.yaml"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: config
              mountPath: /config/nrf.yaml
              subPath: nrf.yaml
      volumes:
        - name: config
          configMap:
            name: open5gs-config
