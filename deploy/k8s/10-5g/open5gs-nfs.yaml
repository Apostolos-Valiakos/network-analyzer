apiVersion: v1
kind: Service
metadata:
  name: open5gs-upf
  namespace: team-5g
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: open5gs-upf
  ports:
    - name: pfcp
      port: 8805
      protocol: UDP
    - name: gtpu
      port: 2152
      protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-upf
  namespace: team-5g
  labels:
    app: open5gs-upf
    app.kubernetes.io/part-of: open5gs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open5gs-upf
  template:
    metadata:
      labels:
        app: open5gs-upf
        app.kubernetes.io/part-of: open5gs
    spec:
      nodeSelector:
        xtrust6g-node: penm
      containers:
        - name: upf
          image: open5gs:2.7.6
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # UE tunnel and internet access through NAT, as on the core host.
              ip tuntap add name ogstun mode tun 2>/dev/null || true
              ip addr replace 10.45.0.1/16 dev ogstun
              ip link set ogstun up
              sysctl -w net.ipv4.ip_forward=1
              iptables -t nat -C POSTROUTING -s 10.45.0.0/16 ! -o ogstun -j MASQUERADE 2>/dev/null \
                || iptables -t nat -A POSTROUTING -s 10.45.0.0/16 ! -o ogstun -j MASQUERADE
              exec render.sh /config/upf.yaml /etc/open5gs/upf.yaml -- open5gs-upfd -c /etc/open5gs/upf.yaml
          securityContext:
            privileged: true    # creates ogstun and NAT rules in its own network namespace
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: config
              mountPath: /config/upf.yaml
              subPath: upf.yaml
      volumes:
        - name: config
          configMap:
            name: open5gs-config
