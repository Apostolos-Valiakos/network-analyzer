# PostgreSQL 14 + TimescaleDB, as in docker-compose.yml. Password from the
# penm-secrets Secret (see the guide, step "PENM secrets").
apiVersion: v1
kind: Service
metadata:
  name: penm-postgres
  namespace: team-penm
spec:
  selector:
    app: penm-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: penm-postgres
  namespace: team-penm
spec:
  serviceName: penm-postgres
  replicas: 1
  selector:
    matchLabels:
      app: penm-postgres
  template:
    metadata:
      labels:
        app: penm-postgres
        app.kubernetes.io/part-of: penm
        penm.capture/exclude: "true"
    spec:
      nodeSelector:
        xtrust6g-node: penm
      containers:
        - name: postgres
          image: timescale/timescaledb:latest-pg14
          env:
            - name: POSTGRES_DB
              value: network_analyzer
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: penm-secrets, key: DB_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
