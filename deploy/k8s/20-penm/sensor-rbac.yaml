# Read-only Kubernetes API access for the sensor's k8s_api_agent.py, which
# lists pods and Services to learn which pod owns each IP where Hubble Relay
# cannot be reached (SMTEC's cluster). Namespace-scoped on purpose: a Role and
# RoleBinding per namespace listed in K8S_NAMESPACES (sensor.yaml), no
# cluster-wide rights, so a namespace admin can apply it.
#
# To watch another namespace: copy the Role and RoleBinding below, change
# both "namespace: team-5g" lines, and add the namespace to K8S_NAMESPACES.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: penm-sensor
  namespace: team-penm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: penm-sensor-read
  namespace: team-5g
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: penm-sensor-read
  namespace: team-5g
subjects:
  - kind: ServiceAccount
    name: penm-sensor
    namespace: team-penm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: penm-sensor-read
