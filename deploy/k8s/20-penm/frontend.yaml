# PENM web UI (root Dockerfile: Nuxt static build served by nginx).
# Browser: http://<VM IP>:30080
apiVersion: v1
kind: Service
metadata:
  name: penm-frontend
  namespace: team-penm
spec:
  type: NodePort
  selector:
    app: penm-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penm-frontend
  namespace: team-penm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penm-frontend
  template:
    metadata:
      labels:
        app: penm-frontend
        app.kubernetes.io/part-of: penm
        penm.capture/exclude: "true"
    spec:
      nodeSelector:
        xtrust6g-node: penm
      containers:
        - name: frontend
          image: penm-frontend:local
          imagePullPolicy: IfNotPresent
          # Runtime copies of the build args, used by nginx's Content-Security-Policy.
          env:
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef: { name: penm-settings, key: API_BASE_URL }
            - name: WS_URL
              valueFrom:
                configMapKeyRef: { name: penm-settings, key: WS_URL }
          ports:
            - containerPort: 80
