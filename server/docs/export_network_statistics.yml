tags:
  - Continuous Monitoring
summary: Export Analytics Data
description: >
  Same underlying flow_statistics data as GET /v1/network/statistics, but
  always returned as a file download (Content-Disposition: attachment)
  rather than an inline JSON array, and with an added "conversations"
  field summarizing the IP pair as text. Intended for the UI's "Export
  Results" download buttons.
produces:
  - application/json
  - text/csv
security:
  - Bearer: []
parameters:
  - name: start_time
    in: query
    type: number
    required: false
    description: Start timestamp (Unix epoch float). Defaults to 0.
    example: 1789111200
  - name: end_time
    in: query
    type: number
    required: false
    description: End timestamp (Unix epoch float). Defaults to current time.
    example: 1789114800
  - name: limit
    in: query
    type: integer
    required: false
    description: Maximum number of records to return (1-10000). Omit for no limit.
  - name: format
    in: query
    type: string
    required: false
    default: csv
    enum: [json, csv]
    description: Response format.
responses:
  200:
    description: >
      Returns the exported analytics data as a downloadable file
      (network_analytics_<start>_<end>.json or .csv).
    schema:
      type: array
      items:
        type: object
        properties:
          ts:
            type: number
            example: 1789111234.5
          id.orig_h:
            type: string
            example: "10.0.0.1"
          id.resp_h:
            type: string
            example: "10.0.0.5"
          proto:
            type: string
            example: "tcp"
          conn_state:
            type: string
            example: "SF"
          orig_bytes:
            type: integer
            example: 4096
          resp_bytes:
            type: integer
            example: 8192
          orig_pkts:
            type: integer
            example: 12
          resp_pkts:
            type: integer
            example: 14
          conversations:
            type: string
            description: Concatenated "id.orig_h <-> id.resp_h" pair, for spreadsheet readability.
            example: "10.0.0.1 <-> 10.0.0.5"
  400:
    description: The "limit" parameter is out of the allowed 1-10000 range, or another request processing error.
    schema:
      type: object
      properties:
        error:
          type: string
          example: "limit must be between 1 and 10000"
