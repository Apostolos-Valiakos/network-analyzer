tags:
  - Continuous Monitoring
summary: Get Latest Role Snapshot
description: >
  Retrieves the most recent role-assessment snapshot from the
  RoleSnapshot table (all rows of one source sharing its latest "ts").
  Two sources fill it side by side: "pcap", the snapshot scheduler, every
  SNAPSHOT_INTERVAL_SECONDS (default 300) from the sensor's latest traffic,
  and "dpi", the sensor's live DPI agent, once per window (default 60 s;
  see POST /v1/ingest/dpi). Both keep SNAPSHOT_RETENTION_HOURS (default
  168) of history. Without "source", the DPI snapshot is returned while it
  is fresh (no older than DPI_FRESH_SECONDS, default 180), otherwise the
  pcap snapshot, otherwise any DPI snapshot. Until the first snapshot, the
  response is an empty result rather than an error.
produces:
  - application/json
  - text/csv
security:
  - Bearer: []
parameters:
  - name: limit
    in: query
    type: integer
    required: false
    default: 1000
    description: Maximum number of records to return (1-10000).
  - name: format
    in: query
    type: string
    required: false
    default: csv
    enum: [json, csv]
    description: Response format.
  - name: source
    in: query
    type: string
    required: false
    enum: [pcap, dpi]
    description: Return this source's latest snapshot instead of the default choice.
responses:
  200:
    description: >
      Returns the latest role assessments. With format=json, a JSON array
      (empty array "[]" if no snapshot exists yet). With format=csv
      (default), a downloadable CSV — EXCEPT when no snapshot exists yet,
      in which case the response is the plain text "No data available"
      (not CSV) at 200.
    schema:
      type: array
      items:
        type: object
        properties:
          ts:
            type: number
            description: Snapshot timestamp (Unix epoch).
            example: 1789111200
          id.orig_h:
            type: string
            description: IP address (field name matches Zeek dot notation).
            example: "10.244.0.77"
          role:
            type: string
            example: "NEAR_RT_RIC"
          confidence:
            type: number
            example: 0.95
          reasoning:
            type: string
            example: "E2AP control-plane traffic observed as the RIC side of the association."
          source:
            type: string
            enum: [pcap, dpi]
            description: Which snapshot the row comes from.
            example: "dpi"
  400:
    description: The "limit" parameter is not an integer in the allowed 1-10000 range, or "source" is not pcap or dpi.
    schema:
      type: object
      properties:
        error:
          type: string
          example: "limit must be between 1 and 10000"
  500:
    description: Internal server error (e.g. database query failure).
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"
