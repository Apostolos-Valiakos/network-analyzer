tags:
  - Streaming Analysis
summary: Start WebSocket Analysis
description: >
  Connects to a sensor's live packet stream (publisher.py, the same
  WebSocket the Real Time page uses), sends START_CAPTURE, and captures for
  the given number of seconds. The packets are then saved as a pcap owned
  by the caller (it appears in History) and analysed like a re-analysis
  (traffic graph and roles). Returns 202 at once; the outcome is sent on
  the WebSocket as {"type": "ANALYSIS_STATUS", "status": "COMPLETE" |
  "FAILED", "message", "filename", ...}, and the stored result is available
  from History. Each request is an independent capture.
consumes:
  - application/json
produces:
  - application/json
security:
  - Bearer: []
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - ws_url
        - seconds
      properties:
        ws_url:
          type: string
          description: The WebSocket URL to connect to (e.g. the sensor's publisher.py).
          example: "ws://10.6.1.155:5002"
        seconds:
          type: integer
          description: Duration in seconds to capture traffic (1-3600).
          example: 60
responses:
  202:
    description: Pipeline started successfully.
    schema:
      type: object
      properties:
        status:
          type: string
          example: "Accepted"
        message:
          type: string
          example: "Pipeline started."
  400:
    description: >
      Missing "ws_url"/"seconds", "seconds" isn't a valid integer, or
      "seconds" is outside the 1-3600 range.
    schema:
      type: object
      properties:
        status:
          type: string
          example: "Error"
        message:
          type: string
          example: "seconds must be between 1 and 3600"
  500:
    description: Failed to connect to or start capturing from the given WebSocket URL.
    schema:
      type: object
      properties:
        status:
          type: string
          example: "Failed"
        message:
          type: string
          example: "Failed to start."
