tags:
  - Core Analysis
summary: Run IP Role Pipeline
description: >
  Runs only the IP role assessment pipeline (evidence-based DPI role
  engine — see role_engine.py) on an already-uploaded PCAP, without the
  full /automated-analysis flow (no UE session extraction, no graph
  built here). Runs in a separate OS process with a 10-minute timeout.
  Optionally scope the analysis to a subset of IPs via "selected_ips".

  Rate limit: 10 requests per minute per authenticated user.
produces:
  - application/json
security:
  - Bearer: []
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required:
        - pcap_file_path
      properties:
        pcap_file_path:
          type: string
          description: Name of the PCAP file in the generated directory (must belong to the caller).
          example: "20260101120000_capture.pcap"
        model_name:
          type: string
          description: Name of the model to use (e.g., rule_based).
          example: "rule_based"
        selected_ips:
          type: array
          items:
            type: string
          description: Optional list of specific IPs to restrict the analysis to.
          example: ["10.0.0.1", "10.0.0.5"]
responses:
  200:
    description: Pipeline executed successfully.
    schema:
      type: object
      properties:
        status:
          type: string
          example: "success"
        total_classified:
          type: integer
          description: Number of IPs that received a role assignment.
          example: 14
        most_frequent_class:
          type: string
          description: The role string with the highest IP count.
          example: "Unidentified"
        processing_time:
          type: number
          description: Wall-clock seconds the pipeline took.
          example: 4.87
        rule_based_classification_summary:
          type: array
          description: One entry per distinct role found, with its member IPs.
          items:
            type: object
            properties:
              class_name:
                type: string
                example: "AMF"
              count:
                type: integer
                example: 1
              ips:
                type: array
                items:
                  type: string
                example: ["10.0.0.5"]
        ip_roles:
          type: object
          description: >
            Map of IP address to its full classification — role, confidence
            (0.0-1.0), and human-readable reasoning citing the evidence
            used. (Note: /automated-analysis's "roles" field is NOT this
            shape — it's a plain {ip: role_string} map. This endpoint's
            "ip_roles" is the enriched object form.)
          additionalProperties:
            type: object
            properties:
              role:
                type: string
                example: "NEAR_RT_RIC"
              confidence:
                type: number
                example: 0.95
              reasoning:
                type: string
                example: "E2AP control-plane traffic observed as the RIC side of the association (SCTP dst 36422)."
          example:
            "10.244.0.77":
              role: "NEAR_RT_RIC"
              confidence: 0.95
              reasoning: "E2AP control-plane traffic observed as the RIC side of the association (SCTP dst 36422)."
        ip_role_details:
          type: object
          description: Same content as "ip_roles" above (pre-merge source field from the pipeline).
  403:
    description: The PCAP exists but belongs to a different user.
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Access denied"
  404:
    description: PCAP file not found.
    schema:
      type: object
      properties:
        error:
          type: string
          example: "PCAP not found"
  429:
    description: Rate limit exceeded — more than 10 requests per minute.
    schema:
      type: object
      properties:
        error:
          type: string
          example: "10 per 1 minute"
  500:
    description: >
      Pipeline failed — the response schema differs by failure mode.
      A packet-load failure gives {"status": "failed", "message": "Failed
      to load packets."}; a worker exception gives {"status": "failed",
      "message": "<exception text>"}; a >600s run gives {"status": "failed",
      "message": "Pipeline Timeout"}; an error in the request handler
      itself gives {"status": "error", "message": "Internal server error"}.
    schema:
      type: object
      properties:
        status:
          type: string
          enum: [failed, error]
        message:
          type: string
          example: "Failed to load packets."
