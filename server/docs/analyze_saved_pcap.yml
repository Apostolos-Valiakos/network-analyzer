tags:
  - Core Analysis
summary: Analyze Saved PCAP
description: >
  Runs a single-pass streaming analysis (packet count, per-IP protocol set,
  and conversation graph) on a PCAP file already owned by the caller (e.g.
  uploaded via /save-pcap). Lighter-weight than /automated-analysis — no
  role classification or UE session extraction, just traffic shape.
produces:
  - application/json
security:
  - Bearer: []
parameters:
  - name: filename
    in: path
    type: string
    required: true
    description: The name of the PCAP file to analyze (must belong to the caller).
    example: "20260101120000_capture.pcap"
responses:
  200:
    description: Analysis successful, returning packet stats and conversation graph.
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Analysis successful"
        analysis:
          type: object
          properties:
            total_packets:
              type: integer
              description: Total packets read from the file.
              example: 18042
            ip_protocols:
              type: object
              description: >
                Map of IP address to the list of protocol/layer names seen
                for that IP (e.g. scapy layer names, or "UNKNOWN(<proto>)"
                for unrecognized IP protocol numbers).
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                "10.0.0.1": ["TCP", "TCP -> HTTP"]
                "10.0.0.2": ["UDP"]
            graph:
              type: object
              description: Force-directed graph of IP conversations (ECharts-shaped).
              properties:
                type:
                  type: string
                  example: "force"
                categories:
                  type: array
                  items:
                    type: object
                  example: [{"name": "IP", "keyword": {}, "base": "IP"}]
                nodes:
                  type: array
                  description: One entry per unique IP.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "10.0.0.1"
                      value:
                        type: integer
                        example: 1
                      category:
                        type: integer
                        example: 0
                links:
                  type: array
                  description: One entry per IP pair that exchanged traffic.
                  items:
                    type: object
                    properties:
                      source:
                        type: integer
                        description: Index into "nodes" for the first endpoint.
                        example: 0
                      target:
                        type: integer
                        description: Index into "nodes" for the second endpoint.
                        example: 1
                      value:
                        type: integer
                        description: Total packets exchanged between this pair, across all protocols.
                        example: 342
  403:
    description: The PCAP exists but belongs to a different user.
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Access denied"
  404:
    description: PCAP file not found (wrong filename, or not owned by the caller).
    schema:
      type: object
      properties:
        error:
          type: string
          example: "File not found"
  500:
    description: Error occurred while reading/parsing the PCAP.
    schema:
      type: object
      properties:
        error:
          type: string
          example: "Internal server error"
