server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options          "DENY"                            always;
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-XSS-Protection         "1; mode=block"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # Content-Security-Policy — single line to avoid nginx multi-line header bugs.
    # style-src-elem is set explicitly because Vuetify injects <style> elements
    # at runtime; without it, modern browsers fall back to default-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; worker-src blob:; connect-src 'self' http://127.0.0.1:5555 http://localhost:5555 http://10.250.100.42:5555 ws://127.0.0.1:5002 ws://localhost:5002 ws://10.250.100.41:5002;" always;

    # Uncomment when TLS is configured:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # ─────────────────────────────────────────────────────────────────────────

    # SPA fallback — all routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
