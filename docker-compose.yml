networks:
  penm_net:
    driver: bridge

services:

  # ── PostgreSQL + TimescaleDB ──────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg14
    container_name: penm_db
    restart: unless-stopped
    networks:
      - penm_net
    environment:
      POSTGRES_DB: network_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flask Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./server
    container_name: penm_backend
    restart: unless-stopped
    networks:
      - penm_net
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-pass}@db:5432/network_analyzer
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_in_production}
      SECRET_TOKEN: ${SECRET_TOKEN:-change_me_in_production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      SENSOR_URL: ${SENSOR_URL:-http://172.18.0.1:5005}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PORT: "5555"
    volumes:
      - backend_uploads:/app/uploads
      - backend_generated:/app/generated_pcaps
      - backend_clusters:/app/cluster_analysis
      - backend_results:/app/results
    ports:
      - "5555:5555"

  # ── Nuxt Frontend (static build served by Nginx) ──────────────────────────
  frontend:
    build:
      context: .
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:5555}
        WS_URL: ${WS_URL:-ws://localhost:5002}
    container_name: penm_frontend
    restart: unless-stopped
    networks:
      - penm_net
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
  backend_uploads:
  backend_generated:
  backend_clusters:
  backend_results:
